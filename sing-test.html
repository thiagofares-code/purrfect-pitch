<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meow Styles</title>
<style>
  :root { --bg:#0e0a1a; --card:#1c1430; --text:#f3eefc; --muted:#b9a9dd; --gold:#ffc94d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; padding:24px 16px 48px; }
  main { max-width:640px; margin:0 auto; }
  h1 { font-size:28px; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border-radius:14px; padding:14px 16px; margin:12px 0; }
  .card b { font-size:20px; }
  .card p { margin:4px 0 10px; color:var(--muted); font-size:15px; }
  button { width:100%; padding:12px; border:0; border-radius:10px; font:600 16px system-ui; cursor:pointer; background:var(--gold); color:#1a0f24; }
  button:focus-visible { outline:3px solid #fff; outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>🐱 Meow styles</h1>
  <p class="lead">The same Ode to Joy phrase sung four ways. Which is least robotic and most like a meow song?</p>
  <div id="list"></div>
</main>
<script>
const STYLES = [
  ['A', 'A-current', 'Now in the game: each note re-synthesised from the recording.'],
  ['B1', 'B1-sampler', 'Sampler style: one untouched meow (the same cat as A) played faster or slower per note, at full length.'],
  ['B2', 'B2-sampler', 'Sampler style with a different, higher kitty meow.'],
  ['C', 'C-sampler-tone-matched', 'B1 with its tone colour matched to the reference: rounder, less bright.'],
];
const player = new Audio();
document.getElementById('list').innerHTML = STYLES.map(([k, f, d]) =>
  `<div class="card"><b>${k}</b><p>${d}</p><button data-f="${f}">▶ Play ${k}</button></div>`).join('');
document.querySelectorAll('button').forEach(b => b.onclick = () => { player.pause(); player.src = `sounds/singtest/${b.dataset.f}.mp3`; player.play(); });
</script>
</body>
</html>
