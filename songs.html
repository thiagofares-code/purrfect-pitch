<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Song Picker</title>
<style>
  :root { --bg:#0e0a1a; --card:#1c1430; --text:#f3eefc; --muted:#b9a9dd; --gold:#ffc94d; --new:#8cff66; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; padding:24px 16px 48px; }
  main { max-width:880px; margin:0 auto; }
  h1 { font-size:28px; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 20px; }
  h2 { font-size:20px; margin:28px 0 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px; }
  .card { background:var(--card); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
  .t { font-weight:700; }
  .c { color:var(--muted); font-size:13px; }
  .tag { font-size:12px; font-weight:700; }
  .tag.cur { color:var(--gold); } .tag.new { color:var(--new); }
  button { margin-top:auto; padding:9px; border:0; border-radius:10px; font:600 15px system-ui; cursor:pointer; background:var(--gold); color:#1a0f24; }
  button:focus-visible { outline:3px solid #fff; outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>🎵 Song picker</h1>
  <p class="lead">The opening of every candidate, played on a music box so you can recognise it. Pick 4 songs per venue (any song can go in any venue); later venues should get faster, busier songs. All are public domain.</p>
  <div id="list"></div>
</main>
<script>
const VENUES = ['The Alley (easiest)', 'The Rooftop', 'The Jazz Club', 'The Opera House', 'The Stadium (hardest)'];
const player = new Audio();
fetch('sounds/songs/songs.json').then(r => r.json()).then(songs => {
  document.getElementById('list').innerHTML = VENUES.map((v, i) => `<h2>${v}</h2><div class="grid">${songs.filter(s => s.venue === i).map(s =>
    `<div class="card"><span class="tag ${s.current ? 'cur">IN THE GAME NOW' : 'new">NEW OPTION'}</span><span class="t">${s.title}</span><span class="c">${s.composer}</span><button data-id="${s.id}">▶ Play</button></div>`).join('')}</div>`).join('');
  document.querySelectorAll('button').forEach(b => b.onclick = () => { player.pause(); player.src = `sounds/songs/${b.dataset.id}.mp3`; player.play(); });
});
</script>
</body>
</html>
