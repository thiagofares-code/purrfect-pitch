<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Auditions</title>
<style>
  :root { --bg:#0e0a1a; --card:#1c1430; --text:#f3eefc; --muted:#b9a9dd; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; padding:24px 16px 48px; }
  main { max-width:880px; margin:0 auto; }
  h1 { font-size:28px; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 24px; }
  section { margin:28px 0; }
  h2 { font-size:20px; margin:0 0 4px; display:flex; align-items:center; gap:10px; }
  h2 .dot { width:14px; height:14px; border-radius:50%; display:inline-block; }
  .hint { color:var(--muted); margin:0 0 12px; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:12px; }
  .card { background:var(--card); border-radius:14px; padding:14px; }
  .num { font-weight:700; font-size:22px; }
  .label { color:var(--muted); font-size:13px; margin-bottom:10px; }
  button { width:100%; padding:10px; border:0; border-radius:10px; font:600 15px system-ui; cursor:pointer; color:#1a0f24; }
  button:focus-visible { outline:3px solid #fff; outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>🐱 Cat Auditions</h1>
  <p class="lead">Each cat sings the same little melody in its own range, autotuned: quick notes and two long ones. Pick a favourite number for each cat.</p>
  <div id="spots"></div>
</main>
<script>
const CATS = [
  ['cat1', 'Cat 1 (pink lane): the lowest voice', '#ff5fa2'],
  ['cat2', 'Cat 2 (yellow lane)', '#ffc94d'],
  ['cat3', 'Cat 3 (purple): the balcony soloist', '#b48cff'],
  ['cat4', 'Cat 4 (cyan lane)', '#4dd8ff'],
  ['cat5', 'Cat 5 (green lane): the highest voice', '#8cff66'],
];
const player = new Audio();
fetch('sounds/audition/voices.json').then(r => r.json()).then(v => {
  document.getElementById('spots').innerHTML = CATS.map(([k, title, color]) => `<section><h2><span class="dot" style="background:${color}"></span>${title}</h2>
    <div class="grid">${(v[k] || []).map((o, i) => `<div class="card"><div class="num">${i + 1}</div>
      <div class="label">natural note ${o.natural} · clarity ${o.hnr} dB</div>
      <button style="background:${color}" data-id="${o.id}">▶ Play</button></div>`).join('')}</div></section>`).join('');
  document.querySelectorAll('button').forEach(b => b.onclick = () => { player.pause(); player.src = `sounds/audition/${b.dataset.id}.mp3`; player.play(); });
});
</script>
</body>
</html>
